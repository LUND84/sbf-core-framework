<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模块 C · 七档到账动画本地预览</title><link rel="stylesheet" href="/module-c-alert-preview.css">
<script type="module" src="/module-c-alert-preview.js"></script></head>
<body><main class="preview-shell">
  <header><div><p class="eyebrow">MODULE C / ORIGINAL ALERTS</p><h1>每一份支持，都有自己的登场。</h1>
    <p>本地视觉演示 · 非真实收款 · 无订单、无支付、无主播任务</p></div><span class="silent">默认静音</span></header>
  <section class="preview-stage" id="preview-stage" aria-label="房间安全区域中的到账动画预览">
    <div class="preview-safe-zone">胸前安全区 · 32% / 50% / 36% / 23%</div>
    <aside id="preview-board" hidden></aside>
    <span class="preview-watermark">LOCAL PREVIEW · NO PAYMENT</span>
  </section>
  <section class="preview-controls" aria-label="七档预览控制"><div id="tier-buttons" class="tier-buttons"></div>
    <div class="preview-actions"><button id="play-all">依次播放七档（52 秒）</button><button id="record-all">导出七档 WebM（静音）</button>
      <a id="download" hidden>下载录屏</a><span id="preview-status" role="status">选择一档查看原创动效</span></div>
    <p class="preview-note">所有视觉限制在胸前局部；不进入脸部、左右榜单或手／键盘。真实页面由确认到账的服务器窗口驱动，轮询与 Logo 更新不重播。</p>
  </section>
</main></body></html>
